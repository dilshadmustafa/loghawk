[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loghawk"
version = "0.1.0"
description = "AI-powered application log analysis and AIOps toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.txt" }

dependencies = [
    "python-dotenv",
    "duckdb",
    "lancedb"
]

[tool.setuptools.packages.find]
where = ["src"]