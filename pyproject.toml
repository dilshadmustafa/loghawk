[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loghawk"
version = "0.1.0"
description = "AI-powered application log analysis and AIOps toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.txt" }

dependencies = [
    "python-dotenv",
    "textual",
    "duckdb",
    "lancedb",
    "litellm",
    "boto3",
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "scikit-learn",
    "pyod"
]

[project.scripts]
hawk = "loghawk.cli.hawk_console:main"

[tool.setuptools.packages.find]
where = ["src"]
