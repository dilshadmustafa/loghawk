[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loghawk"
version = "0.1.0"
description = "AI-powered application log analysis and AIOps toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.txt" }

dependencies = [
    "python-dotenv",
    "textual==8.2.8",
    "duckdb",
    "lancedb==0.40.0",
    "litellm",
    "boto3",
    "fastapi",
    "python-multipart",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "scikit-learn",
    "pyod"
]

[project.scripts]
hawk = "loghawk.cli.hawk_console:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"loghawk.builtin_tasks" = ["manifest.json", "general_tasks/*.sh", "general_tasks/*.ps1", "general_tasks/*.cmd", "collector_tasks/*.sh", "collector_tasks/*.ps1", "collector_tasks/*.cmd", "remediation_tasks/*.sh", "remediation_tasks/*.ps1", "remediation_tasks/*.cmd", "rollback_tasks/*.sh", "rollback_tasks/*.ps1", "rollback_tasks/*.cmd"]
