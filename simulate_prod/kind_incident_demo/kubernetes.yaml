apiVersion: v1
kind: Namespace
metadata:
  name: loghawk-demo
  labels:
    app.kubernetes.io/part-of: loghawk-incident-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: loghawk-demo
  labels:
    app.kubernetes.io/part-of: loghawk-incident-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        app.kubernetes.io/part-of: loghawk-incident-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: loghawk-incident-demo:local
          imagePullPolicy: Never
          args: ["serve"]
          env:
            - name: SERVICE_NAME
              value: order-service
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: loghawk-demo
  labels:
    app: order-service
    app.kubernetes.io/part-of: loghawk-incident-demo
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
