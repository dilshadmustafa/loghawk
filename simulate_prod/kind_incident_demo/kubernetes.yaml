apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
  namespace: loghawk-demo
  labels:
    app.kubernetes.io/part-of: loghawk-incident-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-generator
  template:
    metadata:
      labels:
        app: traffic-generator
        app.kubernetes.io/part-of: loghawk-incident-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traffic
          image: loghawk-incident-demo:local
          imagePullPolicy: Never
          args: ["traffic"]
          env:
            - name: REQUESTS_PER_SECOND
              value: "1"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: loghawk-incident-demo
  namespace: loghawk-demo
  labels:
    release: loghawk-monitoring
    app.kubernetes.io/part-of: loghawk-incident-demo
spec:
  namespaceSelector:
    matchNames: ["loghawk-demo"]
  selector:
    matchLabels:
      app.kubernetes.io/part-of: loghawk-incident-demo
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 5s
